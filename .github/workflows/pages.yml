name: Deploy Fantacalcio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site/src _site/data
          cp index.html _site/
          cp src/*.js src/*.css _site/src/
          cp data/players.json data/infortuni.json data/infortuni_update.json data/pro_contro.json data/pro_contro_runs.json _site/data/
          python3 - <<'PY'
          import json
          from pathlib import Path
          endpoint = "${{ vars.INJURY_TRIGGER_ENDPOINT }}"
          page = Path("_site/index.html")
          page.write_text(page.read_text().replace("__INJURY_TRIGGER_ENDPOINT__", endpoint), encoding="utf-8")

          snapshot = json.loads(Path("_site/data/infortuni.json").read_text(encoding="utf-8"))
          update = json.loads(Path("_site/data/infortuni_update.json").read_text(encoding="utf-8"))
          if update.get("currentInjuries") != len(snapshot.get("injuries", [])):
              raise SystemExit("Injury metadata and snapshot counts differ; refusing stale Pages deploy")
          if not update.get("updatedAt") or update["updatedAt"] != snapshot.get("fetchedAt"):
              raise SystemExit("Injury metadata and snapshot timestamps differ; refusing stale Pages deploy")
          if "__INJURY_TRIGGER_ENDPOINT__" in page.read_text(encoding="utf-8"):
              raise SystemExit("Unresolved injury trigger placeholder")
          PY
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
